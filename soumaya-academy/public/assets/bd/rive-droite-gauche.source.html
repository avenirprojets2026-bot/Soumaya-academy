<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:1536px;height:1024px;font-family:"DejaVu Sans",sans-serif;background:#fff8e8}
</style></head><body>
<svg width="1536" height="1024" viewBox="0 0 1536 1024" xmlns="http://www.w3.org/2000/svg">
<defs>
 <marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#fff"/></marker>
 <marker id="ak" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c2185b"/></marker>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe3ff"/><stop offset="1" stop-color="#e8f6ff"/></linearGradient>
 <g id="kidBack"><!-- enfant vu de dos -->
  <path d="M-52,10 Q0,40 52,10 L40,40 Q0,58 -40,40 Z" fill="#8d5a2b" stroke="#4e2f12" stroke-width="3"/>
  <rect x="-18" y="-40" width="36" height="46" rx="12" fill="#e91e63"/>
  <circle cx="0" cy="-58" r="20" fill="#5d3a1a"/>
  <path d="M-18,-30 L-46,-44" stroke="#f2c29b" stroke-width="9" stroke-linecap="round"/>
  <path d="M18,-30 L46,-44" stroke="#f2c29b" stroke-width="9" stroke-linecap="round"/>
 </g>
 <g id="kidFront"><!-- enfant de face -->
  <path d="M-52,10 Q0,40 52,10 L40,40 Q0,58 -40,40 Z" fill="#8d5a2b" stroke="#4e2f12" stroke-width="3"/>
  <rect x="-18" y="-40" width="36" height="46" rx="12" fill="#e91e63"/>
  <circle cx="0" cy="-58" r="20" fill="#f2c29b"/>
  <path d="M-20,-66 Q0,-90 20,-66 Q14,-76 0,-76 Q-14,-76 -20,-66Z" fill="#5d3a1a"/>
  <circle cx="-7" cy="-58" r="3" fill="#222"/><circle cx="7" cy="-58" r="3" fill="#222"/>
  <path d="M-7,-48 Q0,-43 7,-48" stroke="#222" stroke-width="2.5" fill="none"/>
  <path d="M-18,-30 L-46,-44" stroke="#f2c29b" stroke-width="9" stroke-linecap="round"/>
  <path d="M18,-30 L46,-44" stroke="#f2c29b" stroke-width="9" stroke-linecap="round"/>
 </g>
</defs>
<!-- titre -->
<rect x="250" y="18" width="1036" height="86" rx="43" fill="#283593"/>
<text x="768" y="76" text-anchor="middle" font-size="44" font-weight="bold" fill="#fff">Rive droite ou rive gauche ?</text>
<rect x="40" y="114" width="1456" height="66" rx="33" fill="#fff59d" stroke="#f9a825" stroke-width="3"/>
<text x="768" y="157" text-anchor="middle" font-size="25" font-weight="bold" fill="#333">Je monte dans le bateau, je regarde où va l’eau (vers l’aval) : ma main droite montre la rive droite.</text>

<!-- ===== Panneau 1 : l'eau s'éloigne ===== -->
<g transform="translate(24,196)">
 <rect width="732" height="640" rx="26" fill="#e3f2fd" stroke="#1e88e5" stroke-width="4"/>
 <rect x="16" y="14" width="700" height="56" rx="28" fill="#1e88e5"/>
 <text x="366" y="52" text-anchor="middle" font-size="29" font-weight="bold" fill="#fff">1. L’eau s’éloigne de toi</text>
 <rect x="16" y="82" width="700" height="140" fill="url(#sky)"/>
 <path d="M16,222 L120,140 L210,200 L300,120 L380,190 L470,130 L560,200 L640,150 L716,210 L716,222 Z" fill="#9ccc65"/>
 <rect x="16" y="222" width="700" height="402" fill="#8bc34a"/>
 <!-- rivière : large en bas (près), étroite en haut (loin) -->
 <path d="M330,222 L402,222 L560,624 L172,624 Z" fill="#42a5f5"/>
 <path d="M366,580 L366,290" stroke="#fff" stroke-width="10" marker-end="url(#ar)"/>
 <rect x="296" y="232" width="140" height="36" rx="18" fill="#fff"/><text x="366" y="257" text-anchor="middle" font-size="22" font-weight="bold" fill="#0d47a1">AVAL ↑</text>
 <rect x="226" y="584" width="280" height="36" rx="18" fill="#fff"/><text x="366" y="609" text-anchor="middle" font-size="22" font-weight="bold" fill="#0d47a1">AMONT (d’où vient l’eau)</text>
 <use href="#kidBack" x="366" y="490"/>
 <path d="M408,446 L470,420" stroke="#c2185b" stroke-width="5" marker-end="url(#ak)"/>
 <text x="474" y="414" font-size="21" font-weight="bold" fill="#c2185b">sa main droite</text>
 <rect x="26" y="300" width="212" height="64" rx="16" fill="#fff" stroke="#7b1fa2" stroke-width="3"/>
 <text x="132" y="342" text-anchor="middle" font-size="27" font-weight="bold" fill="#7b1fa2">Rive gauche</text>
 <rect x="490" y="300" width="212" height="64" rx="16" fill="#fff" stroke="#c2185b" stroke-width="4"/>
 <text x="596" y="342" text-anchor="middle" font-size="27" font-weight="bold" fill="#c2185b">Rive droite</text>
 <text x="366" y="676" text-anchor="middle" font-size="25" fill="#222" dy="-20"> </text>
</g>
<text x="390" y="870" text-anchor="middle" font-size="25" font-weight="bold" fill="#1565c0">On voit l’enfant de dos : sa droite = ta droite.</text>
<text x="390" y="904" text-anchor="middle" font-size="25" fill="#222">Rive droite à DROITE de l’image.</text>

<!-- ===== Panneau 2 : l'eau vient vers toi ===== -->
<g transform="translate(780,196)">
 <rect width="732" height="640" rx="26" fill="#fce4ec" stroke="#d81b60" stroke-width="4"/>
 <rect x="16" y="14" width="700" height="56" rx="28" fill="#d81b60"/>
 <text x="366" y="52" text-anchor="middle" font-size="29" font-weight="bold" fill="#fff">2. L’eau vient vers toi (le piège !)</text>
 <rect x="16" y="82" width="700" height="140" fill="url(#sky)"/>
 <path d="M16,222 L130,110 L230,190 L330,96 L420,180 L520,104 L620,190 L716,140 L716,222 Z" fill="#90a4ae"/>
 <path d="M300,108 L330,96 L360,112 Z" fill="#fff"/><path d="M490,116 L520,104 L548,118 Z" fill="#fff"/>
 <rect x="16" y="222" width="700" height="402" fill="#8bc34a"/>
 <path d="M330,222 L402,222 L560,624 L172,624 Z" fill="#42a5f5"/>
 <path d="M366,280 L366,575" stroke="#fff" stroke-width="10" marker-end="url(#ar)"/>
 <rect x="240" y="232" width="252" height="36" rx="18" fill="#fff"/><text x="366" y="257" text-anchor="middle" font-size="22" font-weight="bold" fill="#880e4f">AMONT (la source)</text>
 <rect x="296" y="584" width="140" height="36" rx="18" fill="#fff"/><text x="366" y="609" text-anchor="middle" font-size="22" font-weight="bold" fill="#880e4f">AVAL ↓</text>
 <use href="#kidFront" x="366" y="490"/>
 <path d="M324,446 L262,420" stroke="#c2185b" stroke-width="5" marker-end="url(#ak)"/>
 <text x="258" y="414" text-anchor="end" font-size="21" font-weight="bold" fill="#c2185b">sa main droite</text>
 <rect x="26" y="300" width="212" height="64" rx="16" fill="#fff" stroke="#c2185b" stroke-width="4"/>
 <text x="132" y="342" text-anchor="middle" font-size="27" font-weight="bold" fill="#c2185b">Rive droite</text>
 <rect x="490" y="300" width="212" height="64" rx="16" fill="#fff" stroke="#7b1fa2" stroke-width="3"/>
 <text x="596" y="342" text-anchor="middle" font-size="27" font-weight="bold" fill="#7b1fa2">Rive gauche</text>
</g>
<text x="1146" y="870" text-anchor="middle" font-size="25" font-weight="bold" fill="#ad1457">L’enfant te fait face : sa droite = ta gauche.</text>
<text x="1146" y="904" text-anchor="middle" font-size="25" fill="#222">Rive droite à GAUCHE de l’image.</text>

<!-- à retenir -->
<rect x="40" y="928" width="1456" height="82" rx="20" fill="#e8f5e9" stroke="#43a047" stroke-width="3"/>
<text x="768" y="964" text-anchor="middle" font-size="25" font-weight="bold" fill="#1b5e20">À retenir : on regarde toujours vers l’AVAL, dans le sens du courant.</text>
<text x="768" y="996" text-anchor="middle" font-size="23" fill="#1b5e20">Sur une photo, cherche d’abord la flèche du courant avant de nommer les rives (épreuve juin 2026, la Semois à Bouillon).</text>
</svg></body></html>
